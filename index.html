<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="英単語"><meta name="robots" content="noindex">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>英単語テスト</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&family=Source+Serif+4:opsz,wght@8..60,600&display=swap">
<style>
/* 片手で親指が届く一列。上に問題、下に大きな採点ボタン */
:root{
  --bg:#f3f5f8; --card:#ffffff; --fg:#1d2430; --sub:#5d6878; --line:#d9dee6;
  --accent:#2f5d9e; --ok:#2e7d4f; --mid:#b07a12; --ng:#b2413a; --hint:#eef3fb;
  --f-word:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161d; --card:#1b212b; --fg:#e8ecf2; --sub:#9aa5b5; --line:#2c3441;
  --accent:#7ea7e6; --ok:#5fbf86; --mid:#e0ad45; --ng:#e57d74; --hint:#1f2a3a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161d; --card:#1b212b; --fg:#e8ecf2; --sub:#9aa5b5; --line:#2c3441;
  --accent:#7ea7e6; --ok:#5fbf86; --mid:#e0ad45; --ng:#e57d74; --hint:#1f2a3a; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:520px;margin:0 auto;padding-block:16px 32px;display:flex;flex-direction:column;gap:14px}
h1{font-size:1.15rem;margin:0;text-wrap:balance}
.sub{color:var(--sub);font-size:.85rem;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
label{font-size:.78rem;color:var(--sub);letter-spacing:.04em}
select,input{width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
.field{display:flex;flex-direction:column;gap:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:12px;padding:12px 10px;cursor:pointer;min-height:48px}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--card);font-weight:700}
button:disabled{opacity:.45}
.row{display:flex;gap:10px}.row>*{flex:1 1 0;min-width:0}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);width:0}
.meta{display:flex;justify-content:space-between;color:var(--sub);font-size:.85rem;font-variant-numeric:tabular-nums}
.tag{border:1px solid var(--line);border-radius:999px;padding:0 8px;font-size:.75rem}
.q{font-family:var(--f-word);font-size:2.1rem;line-height:1.25;text-align:center;padding:18px 0 6px;overflow-wrap:anywhere}
.q.ja{font-family:var(--f-body);font-size:1.6rem}
.a{text-align:center;font-size:1.25rem;font-weight:700;color:var(--accent);overflow-wrap:anywhere}
.hint{background:var(--hint);border-radius:10px;padding:8px 12px;font-size:.9rem;text-align:center}
.g-ok{border-color:var(--ok);color:var(--ok);font-weight:700}
.g-mid{border-color:var(--mid);color:var(--mid);font-weight:700}
.g-ng{border-color:var(--ng);color:var(--ng);font-weight:700}
.choices{display:grid;gap:10px}
.stat{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;text-align:center}
.stat b{display:block;font-size:1.4rem;font-variant-numeric:tabular-nums}.stat span{font-size:.68rem;color:var(--sub)}
.list{font-size:.88rem;overflow-wrap:anywhere}
.note{font-size:.8rem;color:var(--sub)}
.small-btn{min-height:40px;padding:8px;font-size:.88rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <div>
    <h1>英単語テスト</h1>
    <p class="sub" id="status">単語を読み込んでいます。</p>
  </div>

  <section class="card" id="setup">
    <div class="field"><label for="scope">出題範囲</label>
      <select id="scope">
        <option value="unlearned">未習得のみ</option>
        <option value="never">まだ一度も出ていない</option>
        <option value="weak">苦手（間違えた回数が多い順）</option>
        <option value="fuzzy">あいまい（前回「惜しい」）</option>
        <option value="recent">最近追加した分</option>
        <option value="all">全部</option>
      </select></div>
    <div class="grid2">
      <div class="field"><label for="count">出題数</label><input type="number" id="count" value="10" min="1" max="500" inputmode="numeric"></div>
      <div class="field"><label for="book">単語帳</label><select id="book"><option value="">すべて</option></select></div>
    </div>
    <div class="grid2">
      <div class="field"><label for="dir">形式</label><select id="dir"><option value="e2j">英 → 日</option><option value="j2e">日 → 英</option><option value="mix">混ぜる</option></select></div>
      <div class="field"><label for="mode">答え方</label><select id="mode"><option value="recall">思い出して自己採点</option><option value="choice">4 択</option></select></div>
    </div>
    <button class="primary" id="start">はじめる</button>
    <p class="note" id="savenote"></p>
  </section>

  <section id="test" hidden>
    <div class="card">
      <div class="bar"><i id="prog"></i></div>
      <div class="meta"><span id="pos"></span><span class="tag" id="bk"></span></div>
      <div class="q" id="qw"></div>
      <div id="hintbox"></div>
      <div class="a" id="ans" hidden></div>
      <div class="choices" id="ch" hidden></div>
      <div class="row" id="pre">
        <button id="hintbtn">ヒント</button>
        <button class="primary" id="show" style="flex:2 1 0">答えを見る</button>
      </div>
      <div class="row" id="grade" hidden>
        <button class="g-ok" data-g="正解">正解</button>
        <button class="g-mid" data-g="惜しい">惜しい</button>
        <button class="g-ng" data-g="不正解">不正解</button>
      </div>
      <div class="row" id="extra" hidden>
        <button class="small-btn" id="ask">あとで聞く</button>
        <button class="small-btn" id="learned">習得にする</button>
      </div>
    </div>
    <div class="row" style="margin-top:12px"><button class="small-btn" id="quit">ここで終えて記録する</button></div>
  </section>

  <section class="card" id="done" hidden>
    <h1>おつかれさま</h1>
    <p class="sub" id="dsum"></p>
    <div class="stat" id="dstat"></div>
    <div id="dlists"></div>
    <p class="note" id="saved"></p>
    <div id="outbox" hidden style="display:flex;flex-direction:column;gap:8px">
      <button class="primary" id="copy">結果をコピー</button>
      <textarea id="out" rows="7" readonly style="width:100%;font:inherit;font-size:.8rem;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:8px"></textarea>
    </div>
    <button id="again">もう一度</button>
  </section>
</div>

// 設定はこの端末に覚える
function saveSet(){const o=loadLocal();o.set={scope:$('#scope').value,count:$('#count').value,dir:$('#dir').value,mode:$('#mode').value,book:$('#book').value};saveLocal(o)}
function loadSet(){const s=loadLocal().set;if(!s)return;for(const k of ['scope','count','dir','mode','book'])if(s[k]!==undefined&&$('#'+k))$('#'+k).value=s[k]}

const POS=[[/ing$/,'動詞の ing 形'],[/ly$/,'副詞'],[/(tion|sion|ment|ness|ity)$/,'名詞'],[/(ive|ous|ful|able|ible|al)$/,'形容詞'],[/ed$/,'過去形か過去分詞'],[/s$/,'複数形か三人称']];
function hintOf(w){const en=w.en;for(const[re,t]of POS)if(re.test(en))return t+'（'+en.length+' 文字）';return en.length+' 文字・先頭は「'+en[0]+'」'}

async function boot(){
  words=JSON.parse(document.getElementById('words').textContent);
  const books=[...new Set(words.map(w=>w.book))];
  books.forEach(b=>{const o=document.createElement('option');o.value=b;o.textContent=b;$('#book').appendChild(o)});
  stats=loadLocal().stats||{};
  loadSet();
  $('#status').textContent=`単語 ${words.length} 語・単語帳 ${books.length} 冊`;
  $('#savenote').textContent='結果はこの iPhone に残ります。終わったら「結果をコピー」を押し、Slack の DM に貼ると Vault に記録されます。';
}

function st(w){return stats[keyOf(w.en)]||{n:0,ok:0,mid:0,ng:0,last:null}}
function isDone(w){return w.done||st(w).learned}

function build(){
  const scope=$('#scope').value, bk=$('#book').value, n=Math.max(1,+$('#count').value||10);
  let p=words.filter(w=>!bk||w.book===bk);
  if(scope==='unlearned')p=p.filter(w=>!isDone(w));
  else if(scope==='recent')p=p.filter(w=>!isDone(w)).slice(-n*3);
  else if(scope==='weak')p=p.filter(w=>st(w).ng>0&&!isDone(w)).sort((a,b)=>st(b).ng-st(a).ng);
  else if(scope==='fuzzy')p=p.filter(w=>st(w).last==='惜しい'&&!isDone(w));
  else if(scope==='never')p=p.filter(w=>st(w).n===0&&!isDone(w));
  if(scope!=='weak')p=p.sort(()=>Math.random()-.5);
  return p.slice(0,n);
}

$('#start').onclick=()=>{saveSet();quiz=build();if(!quiz.length){$('#savenote').textContent='その条件に当てはまる単語がありません。出題範囲を変えてください。';return}
  i=0;res=[];asks=[];$('#setup').hidden=true;$('#done').hidden=true;$('#test').hidden=false;show()};

function show(){
  const w=quiz[i];hinted=false;
  const d=$('#dir').value==='mix'?(Math.random()<.5?'e2j':'j2e'):$('#dir').value;w._d=d;
  $('#prog').style.width=(i/quiz.length*100)+'%';
  $('#pos').textContent=`${i+1} / ${quiz.length}`;$('#bk').textContent=w.book;
  $('#qw').textContent=d==='e2j'?w.en:w.ja;$('#qw').classList.toggle('ja',d!=='e2j');
  $('#ans').textContent=d==='e2j'?w.ja:w.en;$('#ans').hidden=true;$('#hintbox').innerHTML='';
  $('#grade').hidden=true;$('#extra').hidden=true;$('#hintbtn').disabled=false;
  $('#ask').textContent='あとで聞く';$('#learned').textContent='習得にする';
  if($('#mode').value==='choice'){
    $('#pre').hidden=true;$('#ch').hidden=false;
    const right=d==='e2j'?w.ja:w.en;
    const pool=words.filter(x=>x!==w&&(d==='e2j'?x.ja:x.en)!==right).sort(()=>Math.random()-.5).slice(0,3).map(x=>d==='e2j'?x.ja:x.en);
    $('#ch').innerHTML='';
    [right,...pool].sort(()=>Math.random()-.5).forEach(o=>{const b=document.createElement('button');b.textContent=o;
      b.onclick=()=>{$('#ans').hidden=false;$('#ch').hidden=true;grade(o===right?'正解':'不正解')};$('#ch').appendChild(b)});
  }else{$('#ch').hidden=true;$('#pre').hidden=false}
}
$('#hintbtn').onclick=()=>{hinted=true;const h=document.createElement('div');h.className='hint';h.textContent=hintOf(quiz[i]);$('#hintbox').replaceChildren(h);$('#hintbtn').disabled=true};
$('#show').onclick=()=>{$('#ans').hidden=false;$('#pre').hidden=true;$('#grade').hidden=false;$('#extra').hidden=false};
$$('#grade button').forEach(b=>b.onclick=()=>grade(b.dataset.g));
$('#ask').onclick=()=>{const w=quiz[i];if(!asks.includes(w.en))asks.push(w.en);$('#ask').textContent='記録した'};
$('#learned').onclick=()=>{quiz[i]._learn=true;$('#learned').textContent='習得にする ✓'};

function grade(g){
  const w=quiz[i];let label=g;if(hinted&&g==='正解')label='ヒントあり正解';if(hinted&&g==='惜しい')label='ヒントあり惜しい';
  res.push({w,g:label});
  const k=keyOf(w.en);const s=stats[k]||(stats[k]={n:0,ok:0,mid:0,ng:0,last:null});
  s.n++;s.last=g;if(g==='正解')s.ok++;else if(g==='惜しい')s.mid++;else s.ng++;
  $('#grade').hidden=true;
  setTimeout(()=>{if(w._learn)s.learned=true;i++;i<quiz.length?show():finish()},250);
}
$('#quit').onclick=()=>{if(quiz[i]&&quiz[i]._learn){const s=stats[keyOf(quiz[i].en)]||(stats[keyOf(quiz[i].en)]={n:0,ok:0,mid:0,ng:0,last:null});s.learned=true}quiz=quiz.slice(0,res.length);finish()};

async function finish(){
  $('#test').hidden=true;$('#done').hidden=false;
  const c={};res.forEach(r=>c[r.g]=(c[r.g]||0)+1);
  const dirTxt={e2j:'英→日',j2e:'日→英',mix:'混ぜる'}[$('#dir').value];
  $('#dsum').textContent=`${res.length} 語・${dirTxt}・${$('#mode').value==='choice'?'4 択':'自己採点'}`;
  $('#dstat').innerHTML='';ORDER.forEach(k=>{const d=document.createElement('div');const b=document.createElement('b');b.textContent=c[k]||0;const s=document.createElement('span');s.textContent=k;d.append(b,s);$('#dstat').appendChild(d)});
  $('#dlists').innerHTML='';
  ORDER.filter(k=>c[k]).forEach(k=>{const l=document.createElement('label');l.textContent=k;const d=document.createElement('div');d.className='list';d.textContent=res.filter(r=>r.g===k).map(r=>r.w.en).join('、');$('#dlists').append(l,d)});
  const learned=res.filter(r=>r.w._learn).map(r=>r.w.en);
  const o=loadLocal();o.stats=stats;saveLocal(o);
  if(!res.length){$('#saved').textContent='';return}
  const now=new Date();
  const session={at:now.toISOString(),count:res.length,dir:dirTxt,mode:$('#mode').value==='choice'?'4択':'自己採点',scope:$('#scope').selectedOptions[0].text,
    book:$('#book').value||'すべて',results:res.map(r=>({en:r.w.en,g:r.g})),learned,asks,synced:false};
  const pad=n=>String(n).padStart(2,'0');
  let txt=`単語結果 ${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}\n形式: ${dirTxt}（${session.mode}・範囲: ${session.scope}・単語帳: ${session.book}）\n`;
  ORDER.forEach(k=>{const l=res.filter(r=>r.g===k).map(r=>r.w.en);txt+=`${k}: ${l.join(', ')}\n`});
  txt+=`習得: ${learned.join(', ')}\nあとで聞く: ${asks.join(', ')}`;
  const o2=loadLocal();(o2.unsent=o2.unsent||[]).push(txt);saveLocal(o2);
  $('#out').value=txt;$('#outbox').hidden=false;
  $('#saved').textContent='この iPhone に残しました。下の「結果をコピー」を押して、Slack の DM に貼ってください。';
}
$('#copy').onclick=async()=>{const t=$('#out').value;try{await navigator.clipboard.writeText(t);$('#copy').textContent='コピーしました'}catch(e){$('#out').focus();$('#out').select();$('#copy').textContent='上の文を選んでコピーしてください'}};
$('#again').onclick=()=>{$('#done').hidden=true;$('#setup').hidden=false};
boot();
</script>

</body></html>
